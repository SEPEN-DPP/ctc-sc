<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CTC SC — Ferramenta da Comissão Técnica de Classificação</title>
<style>
  :root {
    /* Paleta extraida por inspecao direta do site oficial da SEJURI (sejuri.sc.gov.br)
       em 16/09/2026: fundo branco predominante, wordmark "sc.gov.br" em vermelho + verde,
       numeros/icones institucionais em verde, texto em cinza-escuro. Nao ha azul no
       branding real do site (o unico azul encontrado numa varredura anterior era o botao
       de um plugin de acessibilidade de terceiros, nao a marca da SEJURI) — por isso este
       tema usa verde como cor de acao primaria e vermelho apenas como acento/alerta,
       exatamente como no site oficial. */
    --verde-institucional: #336633;
    --verde-institucional-escuro: #244a24;
    --verde-claro: #8fb13a;
    --vermelho-sc: #c4000b;
    --cinza-texto: #333333;
    --cinza-secundario: #575757;
    --cinza-claro: #e2e5e9;
    --cinza-fundo: #f8fafc;
    --cinza-fundo-alt: #eaedf2;
    --branco: #ffffff;
    --fonte-titulos: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  .topo { background: var(--branco); border-bottom: 1px solid var(--cinza-claro); color: var(--cinza-texto); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
  .topo .marca { display: flex; align-items: center; gap: 0.15rem; font-family: var(--fonte-titulos); font-weight: 800; font-size: 1.3rem; }
  .topo .marca .sigla-vermelha { color: var(--vermelho-sc); }
  .topo .marca .sigla-verde { color: var(--verde-institucional); }
  .topo nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .topo nav button { background: transparent; border: 1px solid var(--cinza-claro); color: var(--cinza-secundario); font-family: var(--fonte-corpo); font-size: 0.85rem; font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 999px; cursor: pointer; }
  .topo nav button:hover, .topo nav button.ativo { background: var(--verde-institucional); border-color: var(--verde-institucional); color: var(--branco); }
  .faixa-titulo { background: var(--branco); border-bottom: 1px solid var(--cinza-claro); padding: 1rem 1.5rem; }
  .faixa-titulo h1 { font-size: 1.3rem; }

  .card h2, .card h3 { font-size: 1.05rem; }

  .grade-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .grade-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

  .botao-primario { background: var(--verde-institucional); color: var(--branco); }
  .botao-primario:hover { background: var(--verde-institucional-escuro); }
  .botao-secundario { background: var(--branco); color: var(--verde-institucional); border-color: var(--verde-institucional); }

  .botao-perigo { background: var(--vermelho-sc); color: var(--branco); }
  .botao-texto { background: transparent; color: var(--verde-institucional); padding: 0.3rem 0.5rem; border: none; text-decoration: underline; cursor: pointer; font-size: 0.85rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--cinza-secundario); margin-bottom: 0.25rem; }
  input, select, textarea { width: 100%; font-family: var(--fonte-corpo); font-size: 0.95rem; padding: 0.5rem 0.6rem; border: 1px solid #c6cad0; border-radius: 6px; background: var(--branco); margin-bottom: 0.9rem; }
  textarea { min-height: 4.5rem; resize: vertical; }
  .campo-checkbox { margin-bottom: 0.9rem; }
  .campo-radio { margin-bottom: 0.9rem; }
  .opcoes-radio { display: flex; flex-wrap: wrap; gap: 0.9rem; }

  .tabela-pip { font-size: 0.85rem; }
  .tabela-pip input, .tabela-pip textarea { margin-bottom: 0; font-size: 0.85rem; }

  .ficha-nota { font-size: 0.8rem; color: var(--cinza-secundario); font-style: italic; }

  .cartao-recolhivel .corpo-recolhivel { margin-top: 0.9rem; }
  .cartao-recolhivel.recolhido .corpo-recolhivel { display: none; }
  fieldset { border: 1px solid var(--cinza-claro); border-radius: var(--raio-padrao); padding: 1rem; margin-bottom: 1rem; }
  fieldset legend { font-family: var(--fonte-titulos); font-weight: 700; color: var(--verde-institucional); padding: 0 0.4rem; }

  .badge-verde { background: #e4efe0; color: var(--verde-institucional); }
  .badge-azul { background: #eaedf2; color: var(--cinza-secundario); }
  .badge-vermelho { background: #fbe3e2; color: var(--vermelho-sc); }
  .badge-cinza { background: var(--cinza-fundo-alt); color: var(--cinza-secundario); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { text-align: left; font-family: var(--fonte-titulos); font-size: 0.72rem; text-transform: uppercase; color: var(--cinza-secundario); border-bottom: 2px solid var(--cinza-claro); padding: 0.55rem 0.5rem; }
  td { padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--cinza-claro); vertical-align: top; }
  tr:hover td { background: var(--cinza-fundo); }
  .painel-fases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .fase-coluna { background: var(--branco); border: 1px solid var(--cinza-claro); border-top: 4px solid var(--verde-institucional); border-radius: var(--raio-padrao); padding: 0.7rem; min-height: 160px; }
  .fase-coluna h4 { font-size: 0.75rem; text-transform: uppercase; color: var(--verde-institucional); }
  .fase-coluna-clicavel { cursor: pointer; }
  .fase-coluna-clicavel:hover { box-shadow: var(--sombra-card); border-color: var(--verde-institucional); }
  .fase-coluna-clicavel:hover h4 { text-decoration: underline; }
  .filtro-fase-ativo { background: var(--cinza-fundo-alt); border-left: 3px solid var(--verde-institucional); border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
  .fase-item { background: var(--cinza-fundo); border-radius: 6px; padding: 0.45rem 0.55rem; margin-bottom: 0.45rem; font-size: 0.82rem; }
  .fase-item.atrasada { border-left: 3px solid var(--vermelho-sc); background: #fdecec; }
  @media (max-width: 900px) { .painel-fases { grid-template-columns: 1fr; } }
  .texto-ajuda { font-size: 0.8rem; color: var(--cinza-secundario); }
  .erro-mensagem { color: var(--vermelho-sc); font-size: 0.85rem; margin-bottom: 0.75rem; }
  .ok-mensagem { color: var(--verde-institucional); font-size: 0.85rem; margin-bottom: 0.75rem; }
  .selecionavel { cursor: pointer; }
  .rodape { text-align: center; color: var(--cinza-secundario); font-size: 0.72rem; padding: 1.5rem; }
  .aba { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
  .kpi { background: var(--branco); border: 1px solid var(--cinza-claro); border-radius: var(--raio-padrao); padding: 0.9rem; text-align: center; }
  .kpi .numero { font-family: "Roboto", var(--fonte-titulos); font-size: 1.7rem; font-weight: 700; color: var(--verde-institucional); }
  .kpi .rotulo { font-size: 0.75rem; color: var(--cinza-secundario); text-transform: uppercase; }
  .tela-acesso { max-width: 460px; margin: 2.5rem auto; padding: 0 1rem; }
  .tela-acesso .marca-grande { font-family: var(--fonte-titulos); font-weight: 800; font-size: 2rem; text-align: center; margin-bottom: 1rem; }
  .tela-acesso .marca-grande .sigla-vermelha { color: var(--vermelho-sc); }
  .tela-acesso .marca-grande .sigla-verde { color: var(--verde-institucional); }
  .usuario-topo { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--cinza-secundario); }
  .usuario-topo select { width: auto; max-width: 340px; margin-bottom: 0; padding: 0.3rem 0.45rem; font-size: 0.82rem; }
  .aviso-atualizacao { background: #fff7e0; border-bottom: 1px solid #f0d68a; padding: 0.55rem 1.5rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .autoria { font-size: 0.75rem; color: var(--cinza-secundario); margin-bottom: 0.75rem; }
  @media (max-width: 600px) { main { padding: 1rem; } .topo { padding: 0.75rem 1rem; } }
  @media print {
    .topo, .faixa-titulo nav, nav, .botao, .rodape, .sem-impressao, .aviso-atualizacao { display: none !important; }
  }
</style>

<body>

<div id="tela-acesso" class="tela-acesso"></div>

<div id="area-app" style="display:none">
  <div class="topo">
    <div class="marca"><span class="sigla-vermelha">CTC</span><span class="sigla-verde">SC</span></div>
    <nav id="nav-principal"></nav>
    <div id="usuario-topo" class="usuario-topo"></div>
  </div>
  <div id="aviso-atualizacao" class="aviso-atualizacao" style="display:none"></div>
  <main id="app"></main>
</div>

<div class="rodape">
  CTC SC — ferramenta de apoio às Comissões Técnicas de Classificação do DPP-SC.
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth, connectAuthEmulator, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
  onAuthStateChanged, sendPasswordResetEmail,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, connectFirestoreEmulator, doc, setDoc, updateDoc, deleteDoc, collection, query, where,
  onSnapshot, serverTimestamp, writeBatch,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* =========================================================================
   CTC SC — versao com banco central (Firebase: login + Firestore).
   Todo o conteudo juridico/temas dos questionarios reproduz literalmente o
   que consta na Nota Tecnica no 1/2026/GT-CTC/GABSEC/SENAPPEN/MJ (Processo
   08016.029504/2025-19) e na Lei 7.210/1984 (LEP), arts. 5o a 9o. Onde a
   norma remete a um anexo nao fornecido (Anexo III - formula de pontuacao
   da Avaliacao de Conduta), esta ferramenta NAO calcula uma pontuacao
   automatica - o nivel de acompanhamento e a prioridade de cada indice de
   vulnerabilidade sao escolhas da propria equipe/CTC.
   Identidade visual: cores e tipografia extraidas do site oficial da SEJURI
   (sejuri.sc.gov.br) em 15/09/2026.
   ========================================================================= */

// ---------------------------------------------------------------------
// Firebase (projeto ctc-sc)
// ---------------------------------------------------------------------
// A apiKey abaixo nao e segredo: identifica o projeto. Quem protege os dados sao as
// regras do firestore.rules (login + perfil + unidade/regional).
const firebaseConfig = {
  apiKey: 'AIzaSyCQiZh6IoDRlP1uRsw9N5Dxg98FRyFTZdc',
  authDomain: 'ctc-sc.firebaseapp.com',
  projectId: 'ctc-sc',
  storageBucket: 'ctc-sc.firebasestorage.app',
  messagingSenderId: '629050090047',
  appId: '1:629050090047:web:d186f1cd86544585698e8a'
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
// Aberto em localhost (testes): usa os emuladores do Firebase, nunca o banco real.
const EM_TESTE = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (EM_TESTE) {
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
}

// ---------------------------------------------------------------------
// Camada de dados (Firestore)
// ---------------------------------------------------------------------
// Cada registro leva unidade + sr (definem quem le e grava, ver firestore.rules), rev
// (controle de concorrencia: quem salva em cima de uma versao velha e recusado em vez
// de apagar o trabalho do colega) e quem/quando criou e alterou. Toda gravacao cria
// junto <colecao>/<id>/historico/<rev> com a copia do registro - trilha de auditoria
// que ninguem edita nem apaga. Nada e apagado de fato: "remover" marca removido: true.
const COLECOES = ['unidades', 'membrosCtc', 'pessoas', 'fases', 'fichas', 'pips', 'reclassificacoes'];
const LISTA_DA_FICHA = {
  servico_social: 'fichasServicoSocial', psicologia: 'fichasPsicologia',
  saude: 'fichasSaude', policia_penal: 'fichasPoliciaPenal'
};
const CAMPOS_META = ['unidade', 'sr', 'rev', '_rev', 'createdBy', 'createdAt', 'updatedBy', 'updatedByNome', 'updatedAt'];

let USUARIO = null;        // conta logada (Firebase Auth)
let PERFIL = null;         // usuarios/{uid}: perfil, status, unidade, sr, cargo
let UNIDADE_ATIVA = null;  // { nome, sr } - fixa para MEMBRO/DIR; escolhida no topo por SR/DPP (null = painel geral)
const CACHE = {};
COLECOES.forEach(function (c) { CACHE[c] = new Map(); });
const CONTAS = new Map();  // usuarios/* no alcance de quem aprova contas (DIR/SR/DPP)
let ESCUTAS = [];          // onSnapshot ativos (cancelados ao sair ou trocar de perfil)
let ESCUTA_FICHAS = null;  // fichas: so da unidade ativa (sao os registros mais pesados)
let COLECOES_CARREGADAS = new Set();
let DADOS = dadosPadrao();

function dadosPadrao() {
  return {
    unidade: { nome: '', tipoEstabelecimento: 'definitivo', regional: '', configurada: false },
    unidadesReferencia: [],
    membrosCtc: [],
    pessoas: [],
    fases: [],
    fichasServicoSocial: [],
    fichasPsicologia: [],
    fichasSaude: [],
    fichasPoliciaPenal: [],
    pips: [],
    reclassificacoes: []
  };
}

function idUnidade(nome, sr) {
  return sr + '_' + nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function milissegundos(ts) { return ts && ts.toMillis ? ts.toMillis() : Date.now(); }

// Copia "de trabalho" de um registro para as telas: sem os campos de controle, mas com
// _rev (a versao em que a tela se baseou), que gravarVarios usa para detectar conflito.
function copiaParaTela(d) {
  const c = JSON.parse(JSON.stringify(d));
  CAMPOS_META.forEach(function (k) { delete c[k]; });
  c._rev = d.rev || 0;
  return c;
}

function daUnidadeAtiva(d) { return !!UNIDADE_ATIVA && d.unidade === UNIDADE_ATIVA.nome && d.sr === UNIDADE_ATIVA.sr; }

function registrosDaUnidade(colecao) {
  return Array.from(CACHE[colecao].values()).filter(daUnidadeAtiva)
    .sort(function (a, b) { return milissegundos(a.createdAt) - milissegundos(b.createdAt); })
    .map(copiaParaTela);
}

// Remonta DADOS (o formato que as telas usam desde a versao local) a partir do cache do
// banco, so com a unidade ativa.
function reconstruirDados() {
  const novo = dadosPadrao();
  if (UNIDADE_ATIVA) {
    const reg = REGIONAIS_SC.find(function (r) { return r.sigla === UNIDADE_ATIVA.sr; });
    const config = CACHE.unidades.get(idUnidade(UNIDADE_ATIVA.nome, UNIDADE_ATIVA.sr));
    novo.unidade = {
      nome: UNIDADE_ATIVA.nome, regional: reg ? reg.nome : UNIDADE_ATIVA.sr,
      tipoEstabelecimento: config ? config.tipoEstabelecimento : 'definitivo', configurada: !!config
    };
    novo.membrosCtc = registrosDaUnidade('membrosCtc').filter(function (m) { return !m.removido; });
    ['pessoas', 'fases', 'pips', 'reclassificacoes'].forEach(function (c) { novo[c] = registrosDaUnidade(c); });
    registrosDaUnidade('fichas').forEach(function (f) {
      const lista = LISTA_DA_FICHA[f.tipo];
      if (lista) novo[lista].push(f);
    });
  }
  DADOS = novo;
}

// Grava um ou mais registros num lote so (tudo ou nada), cada um com o seu historico.
// itens: [{ colecao, registro, acao }] - registro.id e o id do documento.
async function gravarVarios(itens) {
  const lote = writeBatch(db);
  itens.forEach(function (item) {
    const anterior = CACHE[item.colecao].get(item.registro.id);
    const base = item.registro._rev !== undefined ? item.registro._rev : (anterior ? anterior.rev || 0 : 0);
    if ((anterior ? anterior.rev || 0 : 0) !== base) {
      const erro = new Error('conflito'); erro.code = 'conflito'; throw erro;
    }
    const rev = base + 1;
    const conteudo = JSON.parse(JSON.stringify(item.registro));
    CAMPOS_META.forEach(function (k) { delete conteudo[k]; });
    const meta = { rev: rev, updatedBy: USUARIO.uid, updatedByNome: PERFIL.nome || '', updatedAt: serverTimestamp() };
    const ref = doc(db, item.colecao, item.registro.id);
    if (anterior) {
      // merge: preserva unidade, sr e createdBy/createdAt, que nao mudam depois de criados
      lote.set(ref, Object.assign({}, conteudo, meta), { merge: true });
    } else {
      lote.set(ref, Object.assign({}, conteudo, meta, {
        unidade: UNIDADE_ATIVA.nome, sr: UNIDADE_ATIVA.sr, createdBy: USUARIO.uid, createdAt: serverTimestamp()
      }));
    }
    lote.set(doc(db, item.colecao, item.registro.id, 'historico', String(rev)), {
      rev: rev, acao: item.acao, autor: USUARIO.uid, autorNome: PERFIL.nome || '', em: serverTimestamp(), dados: conteudo
    });
  });
  await lote.commit();
}

function mensagemDeErroDoBanco(e) {
  if (e && e.code === 'conflito') return 'Outra pessoa salvou este registro enquanto você editava. Clique em "Atualizar tela" (ou recarregue a página), confira o que mudou e salve de novo.';
  if (e && e.code === 'permission-denied') return 'Não foi possível salvar: seu perfil não tem permissão para esta alteração, ou outra pessoa salvou este registro antes. Recarregue a página e tente de novo.';
  if (e && e.code === 'unavailable') return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  return 'Não foi possível salvar: ' + (e && e.message ? e.message : e);
}

// Grava e avisa em caso de erro. Devolve true se gravou.
async function salvarComAviso(itens) {
  try {
    await gravarVarios(itens);
    reconstruirDados();
    return true;
  } catch (e) {
    console.error(e);
    reconstruirDados();
    alert(mensagemDeErroDoBanco(e));
    return false;
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ---------------------------------------------------------------------
// Regras de prazo (Nota Tecnica, item 4.3.6 e item 4.4.2.2.4)
// ---------------------------------------------------------------------
const PRAZO_PORTA_ENTRADA_HORAS = 72;
const PRAZO_DEMAIS_DIAS = 60;
const RECLASSIFICACAO_MINIMA_MESES = 6;
const RECLASSIFICACAO_MAXIMA_MESES = 12;

function somarHoras(data, horas) { const d = new Date(data); d.setHours(d.getHours() + horas); return d; }
function somarDias(data, dias) { const d = new Date(data); d.setDate(d.getDate() + dias); return d; }
function somarMeses(data, meses) { const d = new Date(data); d.setMonth(d.getMonth() + meses); return d; }
function paraISODate(d) { return d.toISOString().slice(0, 10); }

function calcularPrazoClassificacaoInicial(dataIngresso) {
  const base = dataIngresso ? new Date(dataIngresso + 'T00:00:00') : new Date();
  if (DADOS.unidade.tipoEstabelecimento === 'porta_entrada') {
    return paraISODate(somarHoras(base, PRAZO_PORTA_ENTRADA_HORAS));
  }
  return paraISODate(somarDias(base, PRAZO_DEMAIS_DIAS));
}

function calcularDataReclassificacao(dataBase, meses) {
  const m = Math.min(Math.max(Number(meses) || RECLASSIFICACAO_MAXIMA_MESES, RECLASSIFICACAO_MINIMA_MESES), RECLASSIFICACAO_MAXIMA_MESES);
  return paraISODate(somarMeses(new Date(dataBase), m));
}

function formatarData(valor) {
  if (!valor) return '—';
  const d = new Date(valor + (valor.length === 10 ? 'T00:00:00' : ''));
  if (isNaN(d.getTime())) return valor;
  return d.toLocaleDateString('pt-BR');
}

function hojeISO() { return paraISODate(new Date()); }

// ---------------------------------------------------------------------
// Utilitarios de interface — sempre createElement + closures (nunca
// onclick inline), para evitar problemas de aspas aninhadas.
// ---------------------------------------------------------------------
function el(tag, atributos, filhos) {
  const elemento = document.createElement(tag);
  const attrs = atributos || {};
  Object.keys(attrs).forEach(function (chave) {
    if (chave === 'class') elemento.className = attrs[chave];
    else if (chave === 'texto') elemento.textContent = attrs[chave];
    else if (chave.indexOf('on') === 0 && typeof attrs[chave] === 'function') elemento.addEventListener(chave.slice(2).toLowerCase(), attrs[chave]);
    else elemento.setAttribute(chave, attrs[chave]);
  });
  (filhos || []).forEach(function (filho) {
    if (filho === null || filho === undefined) return;
    if (typeof filho === 'string') elemento.appendChild(document.createTextNode(filho));
    else elemento.appendChild(filho);
  });
  return elemento;
}

function limpar(container) { while (container.firstChild) container.removeChild(container.firstChild); }

function campoTexto(rotulo, opcoes) {
  const op = opcoes || {};
  const wrap = el('div', {});
  wrap.appendChild(el('label', { texto: rotulo }));
  const input = el(op.textarea ? 'textarea' : 'input', { type: op.tipo || 'text', placeholder: op.placeholder || '' });
  if (op.valor) input.value = op.valor;
  wrap.appendChild(input);
  return { wrap: wrap, input: input };
}

function campoSelect(rotulo, opcoesLista, opcoes) {
  const op = opcoes || {};
  const wrap = el('div', {});
  wrap.appendChild(el('label', { texto: rotulo }));
  const select = el('select', {});
  if (op.comBranco) select.appendChild(el('option', { value: '', texto: op.textoBranco || 'Selecione...' }));
  opcoesLista.forEach(function (o) {
    const opt = el('option', { value: o.valor, texto: o.rotulo });
    if (op.valor === o.valor) opt.setAttribute('selected', 'selected');
    select.appendChild(opt);
  });
  if (op.valor) select.value = op.valor;
  wrap.appendChild(select);
  return { wrap: wrap, select: select };
}

function campoCheckbox(rotulo, opcoes) {
  const op = opcoes || {};
  const wrap = el('div', { class: 'campo-checkbox' });
  const input = el('input', { type: 'checkbox' });
  input.style.width = 'auto';
  input.style.display = 'inline-block';
  input.style.marginBottom = '0';
  if (op.aoMudar) input.addEventListener('change', op.aoMudar);
  const label = el('label', {}, [input, ' ' + rotulo]);
  label.style.display = 'flex';
  label.style.alignItems = 'center';
  label.style.gap = '0.4rem';
  label.style.fontWeight = '400';
  wrap.appendChild(label);
  return { wrap: wrap, input: input };
}

let CONTADOR_RADIO = 0;
function campoRadio(rotulo, opcoesLista, opcoes) {
  const op = opcoes || {};
  CONTADOR_RADIO += 1;
  const nomeGrupo = 'radio-' + CONTADOR_RADIO;
  const wrap = el('div', { class: 'campo-radio' });
  wrap.appendChild(el('label', { texto: rotulo }));
  const linha = el('div', { class: 'opcoes-radio' });
  const inputs = opcoesLista.map(function (o) {
    const input = el('input', { type: 'radio', name: nomeGrupo, value: o.valor });
    if (op.valor === o.valor) input.checked = true;
    linha.appendChild(el('label', { class: 'rotulo-radio' }, [input, ' ' + o.rotulo]));
    return input;
  });
  wrap.appendChild(linha);
  return {
    wrap: wrap,
    obterValor: function () { const m = inputs.find(function (i) { return i.checked; }); return m ? m.value : ''; },
    definirValor: function (valor) { inputs.forEach(function (i) { i.checked = (i.value === valor); }); }
  };
}

// Cartao recolhivel: clicar no cabecalho (titulo) expande/recolhe o conteudo. Usado nas
// Fichas 1-6 da pessoa, que sao formularios longos - permite ver so os titulos e abrir

// no sistema completo (public/js/ui.js).
function cartaoRecolhivel(titulo, filhos, opcoes) {
  const op = opcoes || {};
  const aberto = !!op.iniciarAberto;
  const indicador = el('span', { class: 'indicador-recolhivel', texto: aberto ? '▾' : '▸' });
  const cabecalho = el('div', { class: 'cabecalho-recolhivel' }, [
    el('h3', { texto: titulo }),

  ]);

  const cartaoEl = el('div', { class: 'card cartao-recolhivel' + (aberto ? '' : ' recolhido') }, [cabecalho, corpo]);

const ROTULOS_FASE = {

function renderizarPainel(container) {
  if (!UNIDADE_ATIVA) { renderizarPainelGeral(container); return; }

    container.appendChild(el('button', { class: 'botao-texto', texto: '← Voltar ao painel geral', onClick: function () { escolherUnidade(null); } }));

  }));

  container.appendChild(el('p', {
    class: 'texto-ajuda',
    texto: 'Classificação inicial: até 72h em unidade porta de entrada, até 60 dias nos demais estabelecimentos (Nota Técnica, item 4.3.6). Itens em vermelho estão com prazo vencido.'
  }));

    // O clique num item especifico (pessoa) dentro da coluna continua abrindo direto a pessoa
    // (stopPropagation evita que o clique no item tambem dispare o filtro da coluna).

// Painel geral da SR (sua regional) ou do DPP (estado todo): soma por unidade, a partir
// dos registros que o perfil pode ler.
function renderizarPainelGeral(container) {
  container.appendChild(el('h2', { texto: PERFIL.perfil === 'DPP' ? 'Painel estadual' : 'Painel da regional ' + PERFIL.sr }));
  const hoje = hojeISO();
  const porUnidade = new Map();
  function linha(d) {
    const chave = d.sr + '|' + d.unidade;
    if (!porUnidade.has(chave)) porUnidade.set(chave, { nome: d.unidade, sr: d.sr, pessoas: 0, pips: 0, fases: 0, atrasadas: 0, reclass: 0 });
    return porUnidade.get(chave);
  }
  CACHE.pessoas.forEach(function (p) { if (p.situacao === 'ativo') linha(p).pessoas += 1; });
  CACHE.pips.forEach(function (p) { linha(p).pips += 1; });
  CACHE.fases.forEach(function (f) {
    if (f.dataConclusao) return;
    const l = linha(f);
    l.fases += 1;
    if (f.dataPrazo && f.dataPrazo < hoje) l.atrasadas += 1;
  });
  CACHE.reclassificacoes.forEach(function (r) { if (r.status !== 'realizada') linha(r).reclass += 1; });

  const linhas = Array.from(porUnidade.values()).sort(function (a, b) {
    return a.sr === b.sr ? a.nome.localeCompare(b.nome, 'pt-BR') : (a.sr < b.sr ? -1 : 1);
  });
  const total = linhas.reduce(function (t, l) {
    ['pessoas', 'pips', 'fases', 'atrasadas', 'reclass'].forEach(function (k) { t[k] += l[k]; });
    return t;
  }, { pessoas: 0, pips: 0, fases: 0, atrasadas: 0, reclass: 0 });

  container.appendChild(el('div', { class: 'kpis' }, [
    kpi(total.pessoas, 'Pessoas ativas'),
    kpi(total.pips, 'CTCs feitos'),
    kpi(total.fases, 'Fases em andamento'),
    kpi(total.atrasadas, 'Prazos vencidos'),
    kpi(total.reclass, 'Reclassificações pendentes')
  ]));

  if (!linhas.length) {
    container.appendChild(el('p', { class: 'texto-ajuda', texto: 'Nenhuma unidade registrou dados ainda. Para trabalhar numa unidade, escolha-a no seletor "Unidade" no topo.' }));
    return;
  }
  const tabela = el('table', {}, [
    el('thead', {}, [el('tr', {}, [
      el('th', { texto: 'Unidade' }), el('th', { texto: 'SR' }), el('th', { texto: 'Pessoas ativas' }), el('th', { texto: 'CTCs feitos' }),
      el('th', { texto: 'Fases em andamento' }), el('th', { texto: 'Prazos vencidos' }), el('th', { texto: 'Reclass. pendentes' })
    ])]),
    el('tbody', {}, linhas.map(function (l) {
      return el('tr', { class: 'selecionavel', title: 'Abrir esta unidade', onClick: function () { escolherUnidade({ nome: l.nome, sr: l.sr }); } }, [
        el('td', {}, [el('a', { href: '#', texto: l.nome, onClick: function (ev) { ev.preventDefault(); } })]),
        el('td', { texto: l.sr }), el('td', { texto: String(l.pessoas) }), el('td', { texto: String(l.pips) }),
        el('td', { texto: String(l.fases) }),
        el('td', {}, [l.atrasadas ? badge(String(l.atrasadas), 'badge-vermelho') : '0']),
        el('td', { texto: String(l.reclass) })
      ]);
    }))
  ]);
  container.appendChild(cartao([tabela, el('p', { class: 'texto-ajuda', texto: 'Clique numa unidade para abrir os dados dela.' })]));
}

// Unidades da regional: lista oficial + unidades personalizadas que a usuaria tenha
// cadastrado (DADOS.unidadesReferencia, mantido por compatibilidade com backups antigos).
function unidadesDaRegional(siglaOuNome) {
  const reg = REGIONAIS_SC.find(function (r) { return r.sigla === siglaOuNome || r.nome === siglaOuNome; });
  const oficiais = reg ? reg.unidades.slice() : [];
  const extras = DADOS.unidadesReferencia
    .filter(function (u) { return reg && (u.regional === reg.nome || u.regional === reg.sigla || u.regional.indexOf(reg.sigla) === 0); })
    .map(function (u) { return u.nome; })
    .filter(function (n) { return oficiais.indexOf(n) === -1; });
  return oficiais.concat(extras).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
}

function siglaDaRegionalSalva(valor) {
  if (!valor) return '';
  const reg = REGIONAIS_SC.find(function (r) { return r.nome === valor || r.sigla === valor || valor.indexOf(r.sigla) === 0; });
  return reg ? reg.sigla : '';
}

        regime: regime.select.value, tipoPrisao: tipoPrisao.select.value, dataIngresso: dataIngresso.input.value || hojeISO(),

      // Abre a fase de Classificacao e Singularizacao (inicio das Fichas 1-4/Modulo I e II),

      const ok = await salvarComAviso([
        { colecao: 'pessoas', acao: 'registrou ingresso', registro: pessoa },
        { colecao: 'fases', acao: 'abriu fase', registro: fase }

function renderizarFasesDaPessoa(container, pessoa) {
  limpar(container);
  const fases = DADOS.fases.filter(function (f) { return f.pplId === pessoa.id; }).sort(function (a, b) { return a.dataInicio < b.dataInicio ? -1 : 1; });

  const lista = el('div', {}, fases.map(function (f) {
    const atrasada = !f.dataConclusao && f.dataPrazo && f.dataPrazo < hojeISO();
    const linha = el('div', { class: 'fase-item' + (atrasada ? ' atrasada' : '') }, [
      el('strong', { texto: ROTULOS_FASE[f.fase] || f.fase }),
      el('div', { class: 'texto-ajuda', texto: 'Início: ' + formatarData(f.dataInicio) + (f.dataPrazo ? ' · Prazo: ' + formatarData(f.dataPrazo) : '') + (f.dataConclusao ? ' · Concluída em ' + formatarData(f.dataConclusao) : '') })
    ]);
    if (!f.dataConclusao) {
      linha.appendChild(botao('Concluir fase', 'botao-texto', async function () {
        const ok = await salvarComAviso([{ colecao: 'fases', acao: 'concluiu fase', registro: Object.assign({}, f, { dataConclusao: hojeISO() }) }]);
        if (ok) renderizarFasesDaPessoa(container, pessoa);
      }));
    }
    return linha;
  }));

  const proximaFase = campoSelect('Abrir nova fase manualmente', ORDEM_FASES.map(function (f) { return { valor: f, rotulo: ROTULOS_FASE[f] }; }), { comBranco: true });
  const abrirFase = botao('Abrir fase', 'botao-secundario', async function () {
    if (!proximaFase.select.value) return;
    const ok = await salvarComAviso([{ colecao: 'fases', acao: 'abriu fase', registro: { id: uid(), pplId: pessoa.id, fase: proximaFase.select.value, dataInicio: hojeISO(), dataPrazo: null, dataConclusao: null } }]);
    if (ok) renderizarFasesDaPessoa(container, pessoa);
  });

  container.appendChild(cartao([lista, el('div', { class: 'grade grade-2' }, [proximaFase.wrap]), abrirFase]));
}

// Renderizador generico das Fichas 1-4, a partir de CTC_FICHAS_DEF.
function construirCampoFicha(campoDef) {
  if (campoDef.tipo === 'texto') {
    const c = campoTexto(campoDef.rotulo);
    return { wrap: c.wrap, obterValor: function () { return c.input.value; }, definirValor: function (v) { c.input.value = v || ''; } };
  }
  if (campoDef.tipo === 'textarea') {
    const c = campoTexto(campoDef.rotulo, { textarea: true });
    return { wrap: c.wrap, obterValor: function () { return c.input.value; }, definirValor: function (v) { c.input.value = v || ''; } };
  }
  if (campoDef.tipo === 'check') {
    const c = campoCheckbox(campoDef.rotulo);
    return { wrap: c.wrap, obterValor: function () { return c.input.checked; }, definirValor: function (v) { c.input.checked = !!v; } };
  }
  if (campoDef.tipo === 'radio') {
    const c = campoRadio(campoDef.rotulo, campoDef.opcoes);
    return { wrap: c.wrap, obterValor: c.obterValor, definirValor: c.definirValor };
  }
  throw new Error('Tipo de campo desconhecido: ' + campoDef.tipo);
}

function renderizarFicha(container, pessoa, tipo) {
  const def = CTC_FICHAS_DEF[tipo];
  const areaOk = el('div', {});
  const registrosExistentes = DADOS[def.chaveLista].filter(function (q) { return q.pplId === pessoa.id; });
  // Uma ficha de cada tipo por pessoa, no documento <pplId>_<tipo>. Backups antigos
  // podem ter mais de uma (importadas com o id original): vale a principal, ou a ultima.
  const idFicha = pessoa.id + '_' + tipo;
  const registroAtual = registrosExistentes.find(function (q) { return q.id === idFicha; })
    || (registrosExistentes.length ? registrosExistentes[registrosExistentes.length - 1] : null);
  const podeEditar = podeEditarFicha(tipo);

  const profissionalNome = campoTexto(def.profissionalRotulo, { valor: registroAtual ? registroAtual.profissionalNome : '' });
  const registro = def.registroRotulo ? campoTexto(def.registroRotulo, { valor: registroAtual ? registroAtual.registro : '' }) : null;
  const dataReferencia = campoTexto('Data', { tipo: 'date', valor: registroAtual ? registroAtual.dataReferencia : '' });

  const secoesRenderizadas = def.secoes.map(function (secaoDef) {
    const fieldset = el('fieldset', {}, [el('legend', { texto: secaoDef.titulo })]);
    const campos = {};
    secaoDef.campos.forEach(function (campoDef) {
      const campo = construirCampoFicha(campoDef);
      if (registroAtual && registroAtual.valores && registroAtual.valores[campoDef.chave] !== undefined) {
        campo.definirValor(registroAtual.valores[campoDef.chave]);
      }
      campos[campoDef.chave] = campo;
      fieldset.appendChild(campo.wrap);
    });
    if (secaoDef.nota) fieldset.appendChild(el('p', { class: 'ficha-nota', texto: secaoDef.nota }));
    return { fieldset: fieldset, campos: campos };
  });

  const autoria = el('div', { class: 'autoria', texto: registroAtual ? textoAutoria('fichas', registroAtual.id) : '' });
  // registroAtual guarda a versao (_rev) em que esta tela se baseou; cada gravacao avanca
  let baseAtual = registroAtual;
  const salvar = botao('Salvar ' + def.titulo, 'botao-primario', async function () {
    limpar(areaOk);
    const valores = {};
    secoesRenderizadas.forEach(function (s) {
      Object.keys(s.campos).forEach(function (chave) { valores[chave] = s.campos[chave].obterValor(); });
    });
    const registro2 = Object.assign({}, baseAtual || {}, {
      id: baseAtual ? baseAtual.id : idFicha, pplId: pessoa.id, tipo: tipo,
      profissionalNome: profissionalNome.input.value,
      registro: registro ? registro.input.value : null,
      dataReferencia: dataReferencia.input.value,
      valores: valores
    });
    const ok = await salvarComAviso([{ colecao: 'fichas', acao: 'salvou ' + def.titulo, registro: registro2 }]);
    if (!ok) return;
    baseAtual = copiaParaTela(CACHE.fichas.get(registro2.id));
    autoria.textContent = textoAutoria('fichas', registro2.id);
    areaOk.appendChild(mensagemOk(def.titulo + ' salva.'));
  });

  const cabecalho = el('div', { class: 'grade grade-3' }, [profissionalNome.wrap, registro ? registro.wrap : null, dataReferencia.wrap].filter(Boolean));

  const conteudo = [autoria, areaOk, cabecalho]
    .concat(secoesRenderizadas.map(function (s) { return s.fieldset; }))
    .concat([podeEditar ? salvar : el('p', { class: 'texto-ajuda', texto: 'Só quem é ' + areasQueEditamFicha(tipo) + ' na unidade (ou a SR e o DPP) edita esta ficha. Você pode consultá-la.' })]);

  const cartaoFicha = cartaoRecolhivel(def.titulo, conteudo);
  if (!podeEditar) desabilitarCampos(cartaoFicha);
  container.appendChild(cartaoFicha);
}

// Reune o que ja foi preenchido nas Fichas 1-4 para sugerir um rascunho da Ficha 5,
// respondendo ao pedido de preenchimento automatico do PIP a partir dos modulos. So
// copia texto/marcacoes JA REGISTRADOS (nunca gera sintese ou decisao nova); os campos
// "Acao", "Responsavel" e "Prazo" da tabela do PIP e a deliberacao da CTC nunca sao
// preenchidos automaticamente, por nao existir essa informacao nas fichas de origem.
function obterSugestaoAutoPreenchimento(pessoa) {
  const f1 = DADOS.fichasServicoSocial.filter(function (r) { return r.pplId === pessoa.id; }).slice(-1)[0] || null;
  const f2 = DADOS.fichasPsicologia.filter(function (r) { return r.pplId === pessoa.id; }).slice(-1)[0] || null;
  const f3 = DADOS.fichasSaude.filter(function (r) { return r.pplId === pessoa.id; }).slice(-1)[0] || null;
  const f4 = DADOS.fichasPoliciaPenal.filter(function (r) { return r.pplId === pessoa.id; }).slice(-1)[0] || null;
  const v1 = f1 ? f1.valores : {};
  const v2 = f2 ? f2.valores : {};
  const v3 = f3 ? f3.valores : {};
  const v4 = f4 ? f4.valores : {};
  const juntar = function () {
    return Array.prototype.slice.call(arguments).filter(function (p) { return p && String(p).trim(); }).join('\n');
  };

  return {
    sinteseNecessidades: juntar(v1.necessidades_encaminhamentos, v2.recomendacoes_encaminhamentos, v3.encaminhamentos),
    sintesePotencialidades: juntar(v2.fatores_protecao_percebidos),
    sinteseSaude: juntar(v3.descricao_condicao_relevante, v2.situacoes_sofrimento_psiquico_relevantes),
    sinteseFamiliarSocial: juntar(v1.principais_vinculos_familiares_comunitarios, v1.vinculos_fragilizados_rompidos_risco),
    sinteseEducacionalLaboral: juntar(v2.interesses_declarados),
    sinteseInstitucionalCustodia: juntar(v4.sintese_registros_relevantes, v4.descricao_objetiva_fonte_registro),
    // Educacao: nenhuma ficha registra uma prioridade de educacao (so participacao/
    // interesse) - por isso nao e sugerida, para nao inventar um valor.
    prioridadeEducacao: null,
    prioridadeSaude: v3.prioridade_atencao_saude || null,
    prioridadeSocialJuridica: v1.prioridade_acompanhamento_social || null,
    pipTabela: [
      { area: 'Saúde', necessidadeObjetivo: v3.encaminhamentos || '' },
      { area: 'Saúde mental', necessidadeObjetivo: v2.recomendacoes_encaminhamentos || '' },
      { area: 'Assistência Social', necessidadeObjetivo: v1.necessidades_encaminhamentos || '' },
      { area: 'Educação', necessidadeObjetivo: v2.participa_atividade_educacional ? 'Participa de atividade educacional (ver Ficha 2)' : '' },
      { area: 'Trabalho', necessidadeObjetivo: v2.participa_atividade_laboral ? 'Participa de atividade laboral (ver Ficha 2)' : '' },
      { area: 'Jurídico', necessidadeObjetivo: v4.necessidade_atendimento_juridico ? 'Necessidade de atendimento jurídico (Ficha 4)' : '' },
      { area: 'Documentação', necessidadeObjetivo: v1.doc_necessita_regularizacao ? 'Necessita regularização documental (Ficha 1)' : '' },
      { area: 'Vínculos familiares', necessidadeObjetivo: v1.vinculos_fragilizados_rompidos_risco || '' },
      { area: 'Segurança/custódia', necessidadeObjetivo: v4.descricao_objetiva_fonte_registro || '' },
      { area: 'Outros', necessidadeObjetivo: '' }
    ],
    fontesDisponiveis: { servico_social: !!f1, psicologia: !!f2, saude: !!f3, policia_penal: !!f4 }
  };
}

function construirTabelaPip(container) {
  const linhasCampos = CTC_PIP_AREAS.map(function (area) {
    return {
      area: area,
      necessidade: el('textarea', {}),
      acao: el('textarea', {}),
      responsavel: el('input', { type: 'text' }),
      prazo: el('input', { type: 'text' })
    };
  });
  const tabela = el('table', { class: 'tabela-pip' }, [
    el('thead', {}, [el('tr', {}, [
      el('th', { texto: 'Área' }), el('th', { texto: 'Necessidade/objetivo' }),
      el('th', { texto: 'Ação' }), el('th', { texto: 'Responsável' }), el('th', { texto: 'Prazo' })
    ])]),
    el('tbody', {}, linhasCampos.map(function (l) {
      return el('tr', {}, [el('td', { texto: l.area }), el('td', {}, [l.necessidade]), el('td', {}, [l.acao]), el('td', {}, [l.responsavel]), el('td', {}, [l.prazo])]);
    }))
  ]);
  container.appendChild(tabela);
  return {
    obterValores: function () {
      return linhasCampos.map(function (l) {
        return { area: l.area, necessidadeObjetivo: l.necessidade.value, acao: l.acao.value, responsavel: l.responsavel.value, prazo: l.prazo.value };
      });
    },
    definirValores: function (lista) {
      if (!lista) return;
      linhasCampos.forEach(function (l) {
        const c = lista.find(function (x) { return x.area === l.area; });
        if (!c) return;
        l.necessidade.value = c.necessidadeObjetivo || ''; l.acao.value = c.acao || '';
        l.responsavel.value = c.responsavel || ''; l.prazo.value = c.prazo || '';
      });
    },
    preencherSugestoes: function (lista) {
      if (!lista) return;
      linhasCampos.forEach(function (l) {
        const c = lista.find(function (x) { return x.area === l.area; });
        if (c && !l.necessidade.value && c.necessidadeObjetivo) l.necessidade.value = c.necessidadeObjetivo;
      });
    }
  };
}

  const areaErro = el('div', {});
  const historico = el('div', {});

  const camposSintese = {};
  const fieldsetSintese = el('fieldset', {}, [el('legend', { texto: '1. Síntese interdisciplinar' })]);
  CTC_FICHA5_SINTESE_CAMPOS.forEach(function (c) {
    const campo = campoTexto(c.rotulo, { textarea: true });
    camposSintese[c.chave] = campo.input;
    fieldsetSintese.appendChild(campo.wrap);
  });

  const prioEducacao = campoRadio('Educação', CTC_PRIORIDADES);
  const prioSaude = campoRadio('Saúde física/mental', CTC_PRIORIDADES);
  const prioSocialJuridica = campoRadio('Social/jurídica', CTC_PRIORIDADES);
  const fieldsetPrioridades = el('fieldset', {}, [el('legend', { texto: '2. Prioridades' }), prioEducacao.wrap, prioSaude.wrap, prioSocialJuridica.wrap]);

  const fieldsetPip = el('fieldset', {}, [el('legend', { texto: '3. Programa Individualizador da Pena – PIP' })]);
  const tabelaPip = construirTabelaPip(fieldsetPip);

  const botaoAutoPreencher = botao('Pré-preencher com base nas Fichas 1–4', 'botao-secundario', function () {
    const sugestao = obterSugestaoAutoPreenchimento(pessoa);
    Object.keys(camposSintese).forEach(function (chave) {
      if (!camposSintese[chave].value && sugestao[chave]) camposSintese[chave].value = sugestao[chave];
    });
    if (!prioEducacao.obterValor() && sugestao.prioridadeEducacao) prioEducacao.definirValor(sugestao.prioridadeEducacao);
    if (!prioSaude.obterValor() && sugestao.prioridadeSaude) prioSaude.definirValor(sugestao.prioridadeSaude);
    if (!prioSocialJuridica.obterValor() && sugestao.prioridadeSocialJuridica) prioSocialJuridica.definirValor(sugestao.prioridadeSocialJuridica);
    tabelaPip.preencherSugestoes(sugestao.pipTabela);
    const faltando = Object.keys(sugestao.fontesDisponiveis).filter(function (k) { return !sugestao.fontesDisponiveis[k]; });
    alert('Campos vazios foram preenchidos com o que já consta nas Fichas 1–4. Revise tudo antes de salvar.' +
      (faltando.length ? ' Ainda não há registro de: ' + faltando.join(', ') + '.' : ''));
  });

  const alocacao = campoRadio('Providência quanto à alocação e convivência', CTC_FICHA5_ALOCACAO_OPCOES);
  const alocacaoFundamentacao = campoTexto('Fundamentação objetiva', { textarea: true });
  const fieldsetAlocacao = el('fieldset', {}, [el('legend', { texto: '4. Alocação e convivência' }), alocacao.wrap, alocacaoFundamentacao.wrap]);

  const camposDeliberacao = {};
  const checksDeliberacao = CTC_FICHA5_DELIBERACAO_OPCOES.map(function (o) {
    const c = campoCheckbox(o.rotulo); camposDeliberacao[o.chave] = c.input; return c.wrap;
  });
  const deliberacaoObservacoes = campoTexto('Observações', { textarea: true });
  const fieldsetDeliberacao = el('fieldset', {}, [el('legend', { texto: '5. Deliberação' })].concat(checksDeliberacao).concat([deliberacaoObservacoes.wrap]));

  const camposParticipantes = {};
  const camposParticipantesEl = CTC_FICHA5_PARTICIPANTES_CAMPOS.map(function (c) {
    const campo = campoTexto(c.rotulo); camposParticipantes[c.chave] = campo.input; return campo.wrap;
  });
  const fieldsetParticipantes = el('fieldset', {}, [el('legend', { texto: '6. Participantes' }), el('div', { class: 'grade grade-3' }, camposParticipantesEl)]);

  const form = el('form', {
    onSubmit: async function (ev) {
      ev.preventDefault();
      limpar(areaErro);

      const deliberacao = {};
      Object.keys(camposDeliberacao).forEach(function (chave) { deliberacao[chave] = camposDeliberacao[chave].checked; });
      deliberacao.observacoes = deliberacaoObservacoes.input.value;
      const participantes = {};
      Object.keys(camposParticipantes).forEach(function (chave) { participantes[chave] = camposParticipantes[chave].value; });

      // A Ficha 5 nao pede numero de meses ate a reclassificacao (esse campo so aparece,
      // como data editavel, na Ficha 6) - por isso o agendamento inicial usa o teto legal
      // de 12 meses (item 4.4.2.2.4 da Nota Tecnica).
      const dataReclassificacao = calcularDataReclassificacao(hojeISO(), RECLASSIFICACAO_MAXIMA_MESES);
      const pip = {
        id: uid(), pplId: pessoa.id, elaboradoEm: hojeISO(),
        aprovadoPelaCtc: !!deliberacao.pipAprovado,
        dataPrevistaReclassificacao: dataReclassificacao,
        sinteseNecessidades: camposSintese.sinteseNecessidades.value,
        sintesePotencialidades: camposSintese.sintesePotencialidades.value,
        sinteseSaude: camposSintese.sinteseSaude.value,
        sinteseFamiliarSocial: camposSintese.sinteseFamiliarSocial.value,
        sinteseEducacionalLaboral: camposSintese.sinteseEducacionalLaboral.value,
        sinteseInstitucionalCustodia: camposSintese.sinteseInstitucionalCustodia.value,
        prioridadeEducacao: prioEducacao.obterValor() || null,
        prioridadeSaude: prioSaude.obterValor() || null,
        prioridadeSocialJuridica: prioSocialJuridica.obterValor() || null,
        pipTabela: tabelaPip.obterValores(),
        alocacaoConvivencia: { alocacao: alocacao.obterValor() || null, fundamentacao: alocacaoFundamentacao.input.value },
        deliberacao: deliberacao,
        participantes: participantes
      };
      const faseAberta = DADOS.fases.find(function (f) { return f.pplId === pessoa.id && f.fase === 'classificacao_singularizacao' && !f.dataConclusao; });
      const ok = await salvarComAviso([
        { colecao: 'pips', acao: 'registrou Ficha 5 / PIP', registro: pip },
        { colecao: 'reclassificacoes', acao: 'agendou reclassificação', registro: { id: uid(), pplId: pessoa.id, pipAnteriorId: pip.id, dataPrevista: pip.dataPrevistaReclassificacao, motivo: 'periodica', status: 'pendente' } },
        faseAberta
          ? { colecao: 'fases', acao: 'concluiu fase', registro: Object.assign({}, faseAberta, { dataConclusao: hojeISO() }) }
          : { colecao: 'fases', acao: 'registrou fase concluída', registro: { id: uid(), pplId: pessoa.id, fase: 'classificacao_singularizacao', dataInicio: hojeISO(), dataPrazo: null, dataConclusao: hojeISO() } }
      ]);
      if (!ok) return;
      alert('Ficha 5 (Síntese Colegiada e PIP) registrada. Reclassificação prevista para ' + formatarData(pip.dataPrevistaReclassificacao) + ' — a data poderá ser ajustada ao preencher a Ficha 6.');
      recarregarHistorico();
      renderizarApp();
    }
  }, [
    areaErro, botaoAutoPreencher,
    fieldsetSintese, fieldsetPrioridades, fieldsetPip, fieldsetAlocacao, fieldsetDeliberacao, fieldsetParticipantes,
    el('button', { class: 'botao botao-sucesso', type: 'submit', texto: 'Registrar Ficha 5 e agendar reclassificação' })
  ]);

  function recarregarHistorico() {
    limpar(historico);
    const planos = DADOS.pips.filter(function (p) { return p.pplId === pessoa.id; });
    if (!planos.length) return;
    const tabela = el('table', {}, [
      el('thead', {}, [el('tr', {}, [el('th', { texto: 'Elaborado em' }), el('th', { texto: 'Aprovado pela CTC' }), el('th', { texto: 'Reclassificação prevista' }), el('th', { texto: '' })])]),
      el('tbody', {}, planos.map(function (p) {
        return el('tr', {}, [
          el('td', { texto: formatarData(p.elaboradoEm) }),
          el('td', {}, [badge(p.aprovadoPelaCtc ? 'Sim' : 'Não', p.aprovadoPelaCtc ? 'badge-verde' : 'badge-cinza')]),
          el('td', { texto: formatarData(p.dataPrevistaReclassificacao) }),
          el('td', {}, [botao('Imprimir', 'botao-texto', function () { imprimirPip(pessoa, p); })])
        ]);
      }))
    ]);
    historico.appendChild(cartao([el('h3', { texto: 'Histórico — Ficha 5 / PIP' }), tabela]));
  }

  container.appendChild(cartaoRecolhivel('Ficha 5 — Síntese Colegiada e Programa Individualizador da Pena (PIP)', [form]));
  container.appendChild(historico);
  recarregarHistorico();
}

// Escapa texto digitado antes de montar o HTML da impressao (com varios usuarios, o
// que um digita aparece na tela do outro).
function esc(valor) {
  return String(valor).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function imprimirPip(pessoa, pip) {
  const janela = window.open('', '_blank');
  const linhasTabela = (pip.pipTabela || []).map(function (l) {
    return '<tr><td>' + esc(l.area) + '</td><td>' + esc(l.necessidadeObjetivo || '—') + '</td><td>' + esc(l.acao || '—') + '</td><td>' + esc(l.responsavel || '—') + '</td><td>' + esc(l.prazo || '—') + '</td></tr>';
  }).join('');
  janela.document.write(
    '<html><head><meta charset="UTF-8"><title>Ficha 5 - PIP - ' + esc(pessoa.nomeSocial || pessoa.nome) + '</title>' +
    '<style>body{font-family:Arial,sans-serif;padding:2rem;color:#333} h1{font-size:1.2rem} h2{font-size:1rem;margin-top:1.5rem} .rotulo{font-weight:bold} table{width:100%;border-collapse:collapse;font-size:0.85rem} td,th{border:1px solid #ccc;padding:0.3rem;text-align:left}</style>' +
    '</head><body>' +
    '<h1>Ficha 5 — Síntese Colegiada e Programa Individualizador da Pena (PIP)</h1>' +
    '<p><span class="rotulo">Unidade:</span> ' + esc(DADOS.unidade.nome || '—') + '</p>' +
    '<p><span class="rotulo">Pessoa:</span> ' + esc(pessoa.nomeSocial || pessoa.nome) + ' — Prontuário: ' + esc(pessoa.prontuario || '—') + '</p>' +
    '<p><span class="rotulo">Elaborado em:</span> ' + formatarData(pip.elaboradoEm) + '</p>' +
    '<h2>1. Síntese interdisciplinar</h2>' +
    CTC_FICHA5_SINTESE_CAMPOS.map(function (c) { return '<p><span class="rotulo">' + c.rotulo + ':</span> ' + esc(pip[c.chave] || '—') + '</p>'; }).join('') +
    '<h2>2. Prioridades</h2><p>Educação: ' + esc(pip.prioridadeEducacao || '—') + ' · Saúde física/mental: ' + esc(pip.prioridadeSaude || '—') + ' · Social/jurídica: ' + esc(pip.prioridadeSocialJuridica || '—') + '</p>' +
    '<h2>3. Programa Individualizador da Pena – PIP</h2><table><thead><tr><th>Área</th><th>Necessidade/objetivo</th><th>Ação</th><th>Responsável</th><th>Prazo</th></tr></thead><tbody>' + linhasTabela + '</tbody></table>' +
    '<h2>4. Alocação e convivência</h2><p>' + esc((pip.alocacaoConvivencia || {}).alocacao || '—') + ' — ' + esc((pip.alocacaoConvivencia || {}).fundamentacao || '') + '</p>' +
    '<h2>5. Deliberação</h2><p>PIP aprovado: ' + (pip.aprovadoPelaCtc ? 'Sim' : 'Não') + ' — ' + esc((pip.deliberacao || {}).observacoes || '') + '</p>' +
    '<p><span class="rotulo">Reclassificação prevista:</span> ' + formatarData(pip.dataPrevistaReclassificacao) + '</p>' +
    '<hr><p style="font-size:0.75rem;color:#666">Base legal: Lei nº 7.210/1984 (arts. 5º a 9º); Nota Técnica nº 1/2026/GT-CTC/GABSEC/SENAPPEN/MJ; instrumento CTC SC (2026).</p>' +
    '</body></html>'
  );
  janela.document.close();
  janela.focus();
  janela.print();
}

// ---------------------------------------------------------------------
// Ficha 6 — Reclassificacao (item 4.4.2.2.4 da Nota Tecnica: 6 a 12 meses)
// ---------------------------------------------------------------------
function renderizarFicha6(container, pessoa) {
  const areaErro = el('div', {});
  const areaForm = el('div', {});
  const historico = el('div', {});

  container.appendChild(cartaoRecolhivel('Ficha 6 — Reclassificação', [areaErro, areaForm, historico]));

  function carregar() {
    limpar(areaForm);
    limpar(historico);
    const lista = DADOS.reclassificacoes.filter(function (r) { return r.pplId === pessoa.id; });
    const pendente = lista.find(function (r) { return r.status === 'pendente' || r.status === 'atrasada'; });
    if (pendente) {
      areaForm.appendChild(construirFormularioFicha6(pendente));
    } else {
      areaForm.appendChild(el('p', { class: 'texto-ajuda', texto: 'Nenhuma reclassificação pendente no momento — foi aberta automaticamente ao registrar a Ficha 5.' }));
    }
    const realizadas = lista.filter(function (r) { return r.status === 'realizada'; });
    if (realizadas.length) {
      const tabela = el('table', {}, [
        el('thead', {}, [el('tr', {}, [el('th', { texto: 'Realizada em' }), el('th', { texto: 'Motivo' })])]),
        el('tbody', {}, realizadas.map(function (r) {
          return el('tr', {}, [el('td', { texto: formatarData(r.dataRealizada) }), el('td', { texto: r.motivo })]);
        }))
      ]);
      historico.appendChild(cartao([el('h4', { texto: 'Histórico de reclassificações' }), tabela]));
    }
  }

  function construirFormularioFicha6(pendente) {
    const cumprAcoesRealizadas = campoTexto('Ações previstas efetivamente realizadas', { textarea: true });
    const cumprAcoesNaoRealizadas = campoTexto('Ações não realizadas', { textarea: true });
    const cumprMotivos = campoTexto('Motivos da não execução', { textarea: true });
    const fieldsetCumprimento = el('fieldset', {}, [el('legend', { texto: '1. Cumprimento do PIP anterior' }), cumprAcoesRealizadas.wrap, cumprAcoesNaoRealizadas.wrap, cumprMotivos.wrap]);

    const camposAlteracoes = {};
    const checksAlteracoes = CTC_FICHA6_ALTERACOES_OPCOES.map(function (o) { const c = campoCheckbox(o.rotulo); camposAlteracoes[o.chave] = c.input; return c.wrap; });
    const alteracoesDescricao = campoTexto('Descrição', { textarea: true });
    const fieldsetAlteracoes = el('fieldset', {}, [el('legend', { texto: '2. Alterações desde a última classificação' })].concat(checksAlteracoes).concat([alteracoesDescricao.wrap]));

    const novasNecessidades = campoTexto('Novas necessidades identificadas', { textarea: true });
    const fieldsetNovasNecessidades = el('fieldset', {}, [el('legend', { texto: '3. Novas necessidades identificadas' }), novasNecessidades.wrap]);

    const reavEducacao = campoRadio('Educação', CTC_PRIORIDADES);
    const reavSaude = campoRadio('Saúde física/mental', CTC_PRIORIDADES);
    const reavSocialJuridica = campoRadio('Social/jurídica', CTC_PRIORIDADES);
    const fieldsetReavaliacao = el('fieldset', {}, [el('legend', { texto: '4. Reavaliação das prioridades' }), reavEducacao.wrap, reavSaude.wrap, reavSocialJuridica.wrap]);

    const revPermanecem = campoTexto('Ações que permanecem', { textarea: true });
    const revConcluidas = campoTexto('Ações concluídas', { textarea: true });
    const revSubstituidas = campoTexto('Ações que devem ser substituídas ou incluídas', { textarea: true });
    const fieldsetRevisao = el('fieldset', {}, [el('legend', { texto: '5. Revisão do PIP' }), revPermanecem.wrap, revConcluidas.wrap, revSubstituidas.wrap]);

    const botaoAutoPreencher = botao('Pré-preencher com as ações do PIP anterior', 'botao-secundario', function () {
      const planos = DADOS.pips.filter(function (p) { return p.pplId === pessoa.id; });
      if (!planos.length) { alert('Ainda não há Ficha 5 / PIP registrado para esta pessoa.'); return; }
      const ultimo = planos[planos.length - 1];
      const acoes = (ultimo.pipTabela || []).filter(function (l) { return l.acao; }).map(function (l) { return '- [' + l.area + '] ' + l.acao; }).join('\n');
      if (acoes && !revPermanecem.input.value) revPermanecem.input.value = acoes;
      alert('Ações do último PIP copiadas para "Ações que permanecem" — mova para "Concluídas" ou "Substituídas/incluídas" conforme o caso e edite livremente.');
    });

    const situacao = campoRadio('Situação de alocação e convivência', CTC_FICHA6_ALOCACAO_OPCOES);
    const situacaoFundamentacao = campoTexto('Fundamentação', { textarea: true });
    const fieldsetSituacao = el('fieldset', {}, [el('legend', { texto: '6. Situação de alocação e convivência' }), situacao.wrap, situacaoFundamentacao.wrap]);

    const camposDeliberacao = {};
    const checksDeliberacao = CTC_FICHA6_DELIBERACAO_OPCOES.map(function (o) { const c = campoCheckbox(o.rotulo); camposDeliberacao[o.chave] = c.input; return c.wrap; });
    const deliberacaoObservacoes = campoTexto('Observações', { textarea: true });
    const fieldsetDeliberacao = el('fieldset', {}, [el('legend', { texto: '7. Deliberação da CTC' })].concat(checksDeliberacao).concat([deliberacaoObservacoes.wrap]));

    const dataPadrao = new Date();
    dataPadrao.setMonth(dataPadrao.getMonth() + RECLASSIFICACAO_MAXIMA_MESES);
    const dataPrevistaProxima = campoTexto('Data prevista da próxima reclassificação (entre 6 e 12 meses a partir de hoje — item 4.4.2.2.4 da Nota Técnica)', { tipo: 'date', valor: paraISODate(dataPadrao) });
    const fieldsetProxima = el('fieldset', {}, [el('legend', { texto: '8. Próxima reclassificação' }), dataPrevistaProxima.wrap]);

    return el('form', {
      onSubmit: async function (ev) {
        ev.preventDefault();
        limpar(areaErro);

        const hoje = new Date();
        const limiteMin = somarMeses(hoje, RECLASSIFICACAO_MINIMA_MESES);
        const limiteMax = somarMeses(hoje, RECLASSIFICACAO_MAXIMA_MESES);
        const proximaData = new Date((dataPrevistaProxima.input.value || paraISODate(limiteMax)) + 'T00:00:00');
        if (isNaN(proximaData.getTime()) || proximaData < limiteMin || proximaData > limiteMax) {
          areaErro.appendChild(mensagemErro('Data prevista para a próxima reclassificação deve estar entre ' + RECLASSIFICACAO_MINIMA_MESES + ' e ' + RECLASSIFICACAO_MAXIMA_MESES + ' meses a partir de hoje (item 4.4.2.2.4 da Nota Técnica). Para antecipar por alteração significativa, use o registro de reclassificação extraordinária, na aba "Reclassificações".'));
          return;
        }

        const alteracoes = {};
        Object.keys(camposAlteracoes).forEach(function (chave) { alteracoes[chave] = camposAlteracoes[chave].checked; });
        alteracoes.descricao = alteracoesDescricao.input.value;
        const deliberacaoCtc = {};
        Object.keys(camposDeliberacao).forEach(function (chave) { deliberacaoCtc[chave] = camposDeliberacao[chave].checked; });
        deliberacaoCtc.observacoes = deliberacaoObservacoes.input.value;

        const realizada = Object.assign({}, pendente, {
          status: 'realizada',
          dataRealizada: hojeISO(),
          cumprimentoPipAnterior: { acoesPrevistasRealizadas: cumprAcoesRealizadas.input.value, acoesNaoRealizadas: cumprAcoesNaoRealizadas.input.value, motivosNaoExecucao: cumprMotivos.input.value },
          alteracoesDesdeUltimaClassificacao: alteracoes,
          novasNecessidades: novasNecessidades.input.value,
          reavaliacaoPrioridadeEducacao: reavEducacao.obterValor() || null,
          reavaliacaoPrioridadeSaude: reavSaude.obterValor() || null,
          reavaliacaoPrioridadeSocialJuridica: reavSocialJuridica.obterValor() || null,
          revisaoPip: { acoesPermanecem: revPermanecem.input.value, acoesConcluidas: revConcluidas.input.value, acoesSubstituidasIncluidas: revSubstituidas.input.value },
          situacaoAlocacaoConvivencia: { situacao: situacao.obterValor() || null, fundamentacao: situacaoFundamentacao.input.value },
          deliberacaoCtc: deliberacaoCtc
        });

        const ok = await salvarComAviso([
          { colecao: 'reclassificacoes', acao: 'registrou Ficha 6', registro: realizada },
          { colecao: 'reclassificacoes', acao: 'agendou reclassificação', registro: { id: uid(), pplId: pessoa.id, pipAnteriorId: pendente.pipAnteriorId, dataPrevista: paraISODate(proximaData), motivo: 'periodica', status: 'pendente' } }
        ]);
        if (!ok) return;
        alert('Ficha 6 registrada. Próxima reclassificação agendada para ' + formatarData(paraISODate(proximaData)) + '.');
        carregar();
      }
    }, [
      el('p', { class: 'texto-ajuda', texto: 'Reclassificação pendente desde ' + formatarData(pendente.dataPrevista) + '.' }),
      botaoAutoPreencher,
      fieldsetCumprimento, fieldsetAlteracoes, fieldsetNovasNecessidades, fieldsetReavaliacao,
      fieldsetRevisao, fieldsetSituacao, fieldsetDeliberacao, fieldsetProxima,
      el('button', { class: 'botao botao-sucesso', type: 'submit', texto: 'Registrar Ficha 6' })
    ]);
  }

  carregar();
}

// Reclassificacoes
// ---------------------------------------------------------------------
function renderizarReclassificacoes(container) {
  container.appendChild(el('h2', { texto: 'Reclassificações' }));
  container.appendChild(el('p', { class: 'texto-ajuda', texto: 'Intervalo de 6 a 12 meses, conforme item 4.4.2.2.4 da Nota Técnica. Pode ser antecipada por alteração significativa no perfil ou nas condições da pessoa.' }));

  const pendentes = DADOS.reclassificacoes.filter(function (r) { return r.status !== 'realizada'; })
    .sort(function (a, b) { return a.dataPrevista < b.dataPrevista ? -1 : 1; });

  if (!pendentes.length) {
    container.appendChild(el('p', { class: 'texto-ajuda', texto: 'Nenhuma reclassificação pendente.' }));
  } else {
    const tabela = el('table', {}, [
      el('thead', {}, [el('tr', {}, [el('th', { texto: 'Pessoa' }), el('th', { texto: 'Prazo' }), el('th', { texto: 'Motivo' }), el('th', { texto: 'Situação' }), el('th', { texto: '' })])]),
      el('tbody', {}, pendentes.map(function (r) {
        const atrasada = r.dataPrevista < hojeISO();
        return el('tr', {}, [
          el('td', {}, [el('a', { href: '#', texto: nomePessoa(r.pplId), onClick: function (ev) { ev.preventDefault(); PESSOA_SELECIONADA = r.pplId; irParaAba('pessoas'); } })]),
          el('td', { texto: formatarData(r.dataPrevista) }),
          el('td', { texto: r.motivo === 'extraordinaria' ? 'Extraordinária' : 'Periódica' }),
          el('td', {}, [badge(atrasada ? 'Atrasada' : 'Pendente', atrasada ? 'badge-vermelho' : 'badge-azul')]),
          el('td', {}, [botao('Preencher Ficha 6', 'botao-texto', function () {
            PESSOA_SELECIONADA = r.pplId; irParaAba('pessoas');
          })])
        ]);
      }))
    ]);
    container.appendChild(cartao([tabela]));
  }

function baixarJson(objeto, nomeArquivo) {
  const blob = new Blob([JSON.stringify(objeto, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: nomeArquivo }, []);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Leva um backup da versao local (localStorage) para o banco, na unidade ativa.
async function importarBackup(backup, aoProgresso) {
  const b = Object.assign(dadosPadrao(), backup);
  const itens = [];
  let pulados = 0;
  let orfaos = 0;
  function idValido(id) { return typeof id === 'string' && id.length > 0 && id.length <= 200 && id.indexOf('/') === -1 && id !== '.' && id !== '..'; }
  function incluir(colecao, registro) {
    if (!registro || !idValido(registro.id)) return;
    if (CACHE[colecao].has(registro.id)) { pulados += 1; return; }
    const limpo = Object.assign({}, registro);
    delete limpo._rev;
    itens.push({ colecao: colecao, acao: 'importou backup da versão local', registro: limpo });
  }
  const pessoasConhecidas = new Set();
  (b.pessoas || []).forEach(function (p) { if (p && idValido(p.id)) pessoasConhecidas.add(p.id); });
  CACHE.pessoas.forEach(function (p, id) { if (daUnidadeAtiva(p)) pessoasConhecidas.add(id); });
  function daPessoaConhecida(r) {
    if (r && pessoasConhecidas.has(r.pplId)) return true;
    orfaos += 1;
    return false;
  }

  // Pessoas antes do que depende delas: as regras conferem se a pessoa e da mesma unidade.
  if (b.unidade && b.unidade.tipoEstabelecimento) {
    incluir('unidades', { id: idUnidade(UNIDADE_ATIVA.nome, UNIDADE_ATIVA.sr), nome: UNIDADE_ATIVA.nome, tipoEstabelecimento: b.unidade.tipoEstabelecimento });
  }
  (b.membrosCtc || []).forEach(function (m) { incluir('membrosCtc', Object.assign({ removido: false }, m)); });
  (b.pessoas || []).forEach(function (p) { incluir('pessoas', p); });
  ['fases', 'pips', 'reclassificacoes'].forEach(function (c) {
    (b[c] || []).filter(daPessoaConhecida).forEach(function (r) { incluir(c, r); });
  });
  Object.keys(LISTA_DA_FICHA).forEach(function (tipo) {
    const lista = (b[LISTA_DA_FICHA[tipo]] || []).filter(daPessoaConhecida);
    lista.forEach(function (f, i) {
      // a ultima ficha de cada pessoa vira a principal (<pplId>_<tipo>); as anteriores
      // entram com o id original, so para nao se perderem
      const ultimaDaPessoa = !lista.slice(i + 1).some(function (g) { return g.pplId === f.pplId; });
      incluir('fichas', Object.assign({}, f, { id: ultimaDaPessoa ? f.pplId + '_' + tipo : f.id, tipo: tipo }));
    });
  });

  // Lotes pequenos: as regras leem alguns documentos por registro gravado e o Firestore
  // limita essas leituras por lote.
  const TAMANHO_LOTE = 4;
  for (let i = 0; i < itens.length; i += TAMANHO_LOTE) {
    await gravarVarios(itens.slice(i, i + TAMANHO_LOTE));
    aoProgresso(Math.min(i + TAMANHO_LOTE, itens.length), itens.length);
  }
  reconstruirDados();
  return { importados: itens.length, pulados: pulados, orfaos: orfaos };
}

// ---------------------------------------------------------------------
// Mesma alcada do firestore.rules: o DIR aprova membros da propria unidade; a SR,
// diretores(as) e membros da regional; o DPP, qualquer conta (inclusive SR e DPP).
function podeDecidirConta(c) {
  if (!PERFIL || c.uid === USUARIO.uid) return false;
  const alvo = c.perfil || c.perfilSolicitado;
  if (PERFIL.perfil === 'DPP') return true;
  if (PERFIL.perfil === 'SR') return c.sr === PERFIL.sr && (alvo === 'MEMBRO' || alvo === 'DIR');
  if (PERFIL.perfil === 'DIR') return c.sr === PERFIL.sr && c.unidade === PERFIL.unidade && alvo === 'MEMBRO';
  return false;
}

function contasPendentes() {
  return Array.from(CONTAS.values()).filter(function (c) { return c.status === 'PENDENTE' && podeDecidirConta(c); }).length;
}

async function decidirConta(c, mudancas, pergunta) {
  if (pergunta && !window.confirm(pergunta)) return;
  try {
    if (mudancas === null) await deleteDoc(doc(db, 'usuarios', c.uid));
    else await updateDoc(doc(db, 'usuarios', c.uid), Object.assign({}, mudancas, { atualizadoPor: USUARIO.uid, atualizadoEm: serverTimestamp() }));
  } catch (e) {
    console.error(e);
    alert(mensagemDeErroDoBanco(e));
  }
}

let ESCUTA_PERFIL = null;

function mensagemDeErroDeLogin(e) {
  const codigo = e && e.code;
  if (codigo === 'auth/invalid-credential' || codigo === 'auth/wrong-password' || codigo === 'auth/user-not-found') return 'E-mail ou senha incorretos.';
  if (codigo === 'auth/too-many-requests') return 'Muitas tentativas seguidas. Aguarde alguns minutos ou use "Esqueci minha senha".';
  if (codigo === 'auth/email-already-in-use') return 'Já existe uma conta com este e-mail. Use "Entrar" ou "Esqueci minha senha".';
  if (codigo === 'auth/weak-password') return 'A senha precisa ter pelo menos 6 caracteres.';
  if (codigo === 'auth/invalid-email') return 'E-mail inválido.';
  if (codigo === 'auth/network-request-failed') return 'Sem conexão com o servidor. Verifique a internet.';
  return mensagemDeErroDoBanco(e);
}

// Formulario de cadastro. jaLogado: a conta de login existe mas o cadastro nao foi
// concluido (ex.: a gravacao do cadastro falhou) - so pede os dados, sem e-mail/senha.
function formularioCadastro(jaLogado) {
  const nome = campoTexto('Nome completo');
  const matricula = campoTexto('Matrícula');
  const email = jaLogado ? null : campoTexto('E-mail institucional', { tipo: 'email' });
  const senha = jaLogado ? null : campoTexto('Senha (mínimo 6 caracteres)', { tipo: 'password' });
  if (senha) senha.input.setAttribute('autocomplete', 'new-password');
  const perfil = campoSelect('Perfil de acesso', Object.keys(ROTULOS_PERFIL).map(function (k) { return { valor: k, rotulo: ROTULOS_PERFIL[k] }; }), { comBranco: true });
  const cargo = campoSelect('Cargo / área (define qual ficha você preenche)', CARGOS_CONTA, { comBranco: true });
  const regional = campoSelect('Superintendência Regional', REGIONAIS_SC.map(function (r) { return { valor: r.sigla, rotulo: r.nome }; }), { comBranco: true });
  const unidade = campoSelect('Unidade', [], { comBranco: true });
  const unidadeManual = campoTexto('Nome da unidade (como deve aparecer nos documentos)');

  function atualizar() {
    const p = perfil.select.value;
    const comUnidade = p === 'MEMBRO' || p === 'DIR';
    cargo.wrap.style.display = p === 'MEMBRO' ? 'block' : 'none';
    regional.wrap.style.display = p && p !== 'DPP' ? 'block' : 'none';
    unidade.wrap.style.display = comUnidade ? 'block' : 'none';
    unidadeManual.wrap.style.display = comUnidade && unidade.select.value === OPCAO_OUTRA_UNIDADE ? 'block' : 'none';
  }
  function preencherUnidades() {
    limpar(unidade.select);
    const sigla = regional.select.value;
    unidade.select.appendChild(el('option', { value: '', texto: sigla ? 'Escolha a unidade...' : 'Escolha primeiro a regional' }));
    if (sigla) {
      unidadesDaRegional(sigla).forEach(function (n) { unidade.select.appendChild(el('option', { value: n, texto: n })); });
      unidade.select.appendChild(el('option', { value: OPCAO_OUTRA_UNIDADE, texto: '+ Minha unidade não está na lista' }));
    }
    atualizar();
  }
  perfil.select.addEventListener('change', atualizar);
  regional.select.addEventListener('change', preencherUnidades);
  unidade.select.addEventListener('change', atualizar);
  preencherUnidades();

  const area = el('div', {});
  const enviar = el('button', { class: 'botao botao-primario', type: 'submit', texto: 'Enviar cadastro' });
  return el('form', {
    class: 'card',
    onSubmit: async function (ev) {
      ev.preventDefault();
      limpar(area);
      const p = perfil.select.value;
      const comUnidade = p === 'MEMBRO' || p === 'DIR';
      const nomeUnidade = unidade.select.value === OPCAO_OUTRA_UNIDADE ? unidadeManual.input.value.trim() : unidade.select.value;
      const faltando = [];
      if (!nome.input.value.trim()) faltando.push('nome');
      if (!p) faltando.push('perfil');
      if (p === 'MEMBRO' && !cargo.select.value) faltando.push('cargo');
      if (p && p !== 'DPP' && !regional.select.value) faltando.push('regional');
      if (comUnidade && !nomeUnidade) faltando.push('unidade');
      if (!jaLogado && (!email.input.value.trim() || !senha.input.value)) faltando.push('e-mail e senha');
      if (faltando.length) { area.appendChild(mensagemErro('Preencha: ' + faltando.join(', ') + '.')); return; }

      enviar.disabled = true;
      CADASTRO_EM_ANDAMENTO = true;
      try {
        if (!auth.currentUser) await createUserWithEmailAndPassword(auth, email.input.value.trim(), senha.input.value);
        await setDoc(doc(db, 'usuarios', auth.currentUser.uid), {
          nome: nome.input.value.trim(),
          matricula: matricula.input.value.trim(),
          email: auth.currentUser.email,
          perfilSolicitado: p,
          perfil: null,
          cargo: p === 'MEMBRO' ? cargo.select.value : null,
          sr: p === 'DPP' ? null : regional.select.value,
          unidade: comUnidade ? nomeUnidade : null,
          status: 'PENDENTE',
          criadoEm: serverTimestamp()
        });
        // a escuta do perfil leva para a tela "aguardando aprovacao"
      } catch (e) {
        console.error(e);
        area.appendChild(mensagemErro(mensagemDeErroDeLogin(e)));
        enviar.disabled = false;
      } finally {
        CADASTRO_EM_ANDAMENTO = false;
      }
    }
  }, [
    el('h2', { texto: jaLogado ? 'Concluir cadastro' : 'Criar conta' }),
    el('p', { class: 'texto-ajuda', texto: 'Depois de enviar, a conta fica aguardando aprovação: membros pelo(a) diretor(a) da unidade, diretores(as) pela SR, e SR/DPP pelo DPP.' }),
    area,
    nome.wrap, matricula.wrap,
    email ? email.wrap : null, senha ? senha.wrap : null,
    perfil.wrap, cargo.wrap, regional.wrap, unidade.wrap, unidadeManual.wrap,
    enviar
  ]);
}
