    el('h2', { texto: pendente ? 'Cadastro enviado' : 'Acesso suspenso' }),
    el('p', { texto: pendente
      ? 'Sua conta aguarda a aprovação ' + (quemAprova[PERFIL.perfilSolicitado] || 'do DPP') + '. Esta tela se atualiza sozinha quando a conta for aprovada.'
      : 'Seu acesso foi suspenso. Procure o(a) diretor(a) da unidade, a SR ou o DPP.' }),
    el('p', { class: 'texto-ajuda', texto: PERFIL.nome + ' · ' + (ROTULOS_PERFIL[PERFIL.perfil || PERFIL.perfilSolicitado] || '') +
      (PERFIL.cargo ? ' · ' + rotuloCargo(PERFIL.cargo) : '') + (PERFIL.unidade ? ' · ' + PERFIL.unidade : '') + (PERFIL.sr ? ' (' + PERFIL.sr + ')' : '') }),
    botao('Sair', 'botao-secundario', function () { signOut(auth); })
  ])]);
}

// ---------------------------------------------------------------------
// Topo: unidade ativa (SR/DPP), usuario logado, aviso de atualizacao
// ---------------------------------------------------------------------
function unidadesNoAlcance() {
  const regionais = PERFIL.perfil === 'DPP' ? REGIONAIS_SC : REGIONAIS_SC.filter(function (r) { return r.sigla === PERFIL.sr; });
  const lista = [];
  regionais.forEach(function (r) { r.unidades.forEach(function (n) { lista.push({ nome: n, sr: r.sigla }); }); });
  // unidades fora da lista oficial que ja tem registros ("minha unidade nao esta na lista")
  ['unidades', 'pessoas', 'membrosCtc'].forEach(function (c) {
    CACHE[c].forEach(function (d) {
      if (!d.unidade || !regionais.some(function (r) { return r.sigla === d.sr; })) return;
      if (!lista.some(function (u) { return u.nome === d.unidade && u.sr === d.sr; })) lista.push({ nome: d.unidade, sr: d.sr });
    });
  });
  return lista;
}

function montarTopo() {
  const area = document.getElementById('usuario-topo');
  limpar(area);
  if (ehRegionalOuDPP()) {
    const seletor = el('select', { title: 'Unidade' });
    seletor.appendChild(el('option', { value: '', texto: PERFIL.perfil === 'DPP' ? 'Todas as unidades (painel estadual)' : 'Todas as unidades da ' + PERFIL.sr }));
    const unidades = unidadesNoAlcance();
    const regionais = PERFIL.perfil === 'DPP' ? REGIONAIS_SC : REGIONAIS_SC.filter(function (r) { return r.sigla === PERFIL.sr; });
    regionais.forEach(function (r) {
      const grupo = el('optgroup', { label: r.sigla });
      unidades.filter(function (u) { return u.sr === r.sigla; })
        .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); })
        .forEach(function (u) { grupo.appendChild(el('option', { value: u.sr + '|' + u.nome, texto: u.nome })); });
      seletor.appendChild(grupo);
    });
    seletor.value = UNIDADE_ATIVA ? UNIDADE_ATIVA.sr + '|' + UNIDADE_ATIVA.nome : '';
    seletor.addEventListener('change', function () {
      const v = seletor.value;
      escolherUnidade(v ? { sr: v.slice(0, v.indexOf('|')), nome: v.slice(v.indexOf('|') + 1) } : null);
    });
    area.appendChild(el('span', {}, ['Unidade: ', seletor]));
  }
  area.appendChild(el('span', { texto: PERFIL.nome + ' · ' + (PERFIL.perfil === 'MEMBRO' && PERFIL.cargo ? rotuloCargo(PERFIL.cargo) : ROTULOS_PERFIL[PERFIL.perfil]) }));
  area.appendChild(botao('Sair', 'botao-texto', function () { signOut(auth); }));
}

function escolherUnidade(unidade) {
  UNIDADE_ATIVA = unidade;
  PESSOA_SELECIONADA = null;
  FILTRO_FASE = null;
  escutarFichas();
  reconstruirDados();
  montarTopo();
  irParaAba(unidade || ABA_ATUAL === 'contas' ? ABA_ATUAL : 'painel');
}

function mostrarAvisoAtualizacao() {
  const aviso = document.getElementById('aviso-atualizacao');
  limpar(aviso);
  aviso.appendChild(el('span', { texto: 'Outra pessoa alterou dados desta unidade. Atualize a tela para ver (o que você digitou e ainda não salvou será perdido).' }));
  aviso.appendChild(botao('Atualizar tela', 'botao-secundario', function () { renderizarApp(); }));
  aviso.style.display = 'flex';
}

function esconderAvisoAtualizacao() {
  document.getElementById('aviso-atualizacao').style.display = 'none';
}

// ---------------------------------------------------------------------
// Escutas do banco (onSnapshot) e sessao
// ---------------------------------------------------------------------
// Filtros iguais ao alcance das regras: o Firestore recusa consultas mais amplas
// do que o perfil pode ler.
function filtrosDoAlcance() {
  if (PERFIL.perfil === 'DPP') return [];
  if (PERFIL.perfil === 'SR') return [where('sr', '==', PERFIL.sr)];
  return [where('unidade', '==', PERFIL.unidade), where('sr', '==', PERFIL.sr)];
}

function escutar(colecao, filtros) {
  return onSnapshot(query(collection(db, colecao), ...filtros), function (snap) {
    let deOutraPessoa = false;
    snap.docChanges().forEach(function (m) {
      if (m.type === 'removed') { CACHE[colecao].delete(m.doc.id); return; }
      // 'estimate': gravacao propria ainda sem a hora do servidor vem com a hora local
      // (so para exibir e ordenar - updatedAt/createdAt nunca sao regravados do cache)
      const d = m.doc.data({ serverTimestamps: 'estimate' });
      CACHE[colecao].set(m.doc.id, d);
      if (d.updatedBy !== USUARIO.uid) deOutraPessoa = true;
    });
    const primeiraCarga = !COLECOES_CARREGADAS.has(colecao);
    COLECOES_CARREGADAS.add(colecao);
    aoMudarDados(primeiraCarga ? false : deOutraPessoa, primeiraCarga);
  }, function (erro) {
    console.error('Erro ao escutar ' + colecao, erro);
    const aviso = document.getElementById('aviso-atualizacao');
    limpar(aviso);
    aviso.appendChild(el('span', { texto: 'Não foi possível carregar os dados (' + colecao + '): ' + erro.message + '. Recarregue a página.' }));
    aviso.style.display = 'flex';
  });
}

// Telas com formulario nao sao redesenhadas sozinhas (perderiam o que esta sendo
// digitado): mudancas de outra pessoa mostram o aviso "Atualizar tela".
function aoMudarDados(deOutraPessoa, primeiraCarga) {
  reconstruirDados();
  if (COLECOES_CARREGADAS.size < COLECOES.length) return;
  if (primeiraCarga) { montarTopo(); renderizarApp(); return; }
  if (ABA_ATUAL === 'painel') renderizarApp();
  else if (deOutraPessoa) mostrarAvisoAtualizacao();
}

function escutarFichas() {
  if (ESCUTA_FICHAS) ESCUTA_FICHAS();
  ESCUTA_FICHAS = null;
  CACHE.fichas.clear();
  if (!UNIDADE_ATIVA) { COLECOES_CARREGADAS.add('fichas'); return; }
  COLECOES_CARREGADAS.delete('fichas');
  ESCUTA_FICHAS = escutar('fichas', [where('unidade', '==', UNIDADE_ATIVA.nome), where('sr', '==', UNIDADE_ATIVA.sr)]);
}

function escutarContas() {
  if (!ehGestor()) return;
  ESCUTAS.push(onSnapshot(query(collection(db, 'usuarios'), ...filtrosDoAlcance()), function (snap) {
    CONTAS.clear();
    snap.forEach(function (d) { CONTAS.set(d.id, Object.assign({ uid: d.id }, d.data())); });
    montarNavegacao();
    if (ABA_ATUAL === 'contas' && COLECOES_CARREGADAS.size === COLECOES.length) renderizarApp();
  }, function (erro) { console.error('Erro ao escutar contas', erro); }));
}

function pararEscutas() {
  ESCUTAS.forEach(function (cancelar) { cancelar(); });
  ESCUTAS = [];
  if (ESCUTA_FICHAS) { ESCUTA_FICHAS(); ESCUTA_FICHAS = null; }
  COLECOES.forEach(function (c) { CACHE[c].clear(); });
  CONTAS.clear();
  COLECOES_CARREGADAS = new Set();
  UNIDADE_ATIVA = null;
  PESSOA_SELECIONADA = null;
  FILTRO_FASE = null;
  ABA_ATUAL = 'painel';
  DADOS = dadosPadrao();
}

function iniciarSessao() {
  pararEscutas();
  if (!PERFIL) { if (!CADASTRO_EM_ANDAMENTO) mostrarCompletarCadastro(); return; }
  if (PERFIL.status !== 'ATIVO') { mostrarAguardando(); return; }
  if (PERFIL.perfil === 'MEMBRO' || PERFIL.perfil === 'DIR') UNIDADE_ATIVA = { nome: PERFIL.unidade, sr: PERFIL.sr };
  const filtros = filtrosDoAlcance();
  COLECOES.filter(function (c) { return c !== 'fichas'; }).forEach(function (c) { ESCUTAS.push(escutar(c, filtros)); });
  escutarFichas();
  escutarContas();
  mostrarApp();
  montarTopo();
  montarNavegacao();
  renderizarApp();
}

// ---------------------------------------------------------------------
// Inicializacao
// ---------------------------------------------------------------------
onAuthStateChanged(auth, function (usuario) {
  if (ESCUTA_PERFIL) { ESCUTA_PERFIL(); ESCUTA_PERFIL = null; }
  pararEscutas();
  USUARIO = usuario;
  PERFIL = null;
  if (!usuario) { mostrarLogin(); return; }
  if (!CADASTRO_EM_ANDAMENTO) mostrarTelaAcesso([el('p', { class: 'texto-ajuda', texto: 'Carregando sua conta...' })]);
  let primeiraLeitura = true;
  ESCUTA_PERFIL = onSnapshot(doc(db, 'usuarios', usuario.uid), function (s) {
    const novo = s.exists() ? s.data() : null;
    const mudouAcesso = primeiraLeitura || !novo || !PERFIL || novo.status !== PERFIL.status || novo.perfil !== PERFIL.perfil ||
      novo.unidade !== PERFIL.unidade || novo.sr !== PERFIL.sr || novo.cargo !== PERFIL.cargo;
    primeiraLeitura = false;
    PERFIL = novo;
    if (mudouAcesso) iniciarSessao();
  }, function (erro) {
    console.error(erro);
    mostrarTelaAcesso([mensagemErro('Não foi possível ler sua conta: ' + erro.message), botao('Sair', 'botao-secundario', function () { signOut(auth); })]);
  });
});
</script>
